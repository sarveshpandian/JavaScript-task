<!DOCTYPE html>
<html>
<head>
    <title>SpendSmart - Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="side">
    <h2> Tracking finance</h2>
    <h3> Home</h3>
    <h3> Expenses</h3>
</div>

<div class="main">
    <h1>Welcome to Tracking finance</h1>
   

    <div class="section">
        <h2>Add Expense</h2>

        <form id="expenseForm">
            <input id="name" type="text" placeholder="Expense name" required>
            <input id="amount" type="number" placeholder="Amount (Rs.)" min="0.01" step="0.01" required>

            <select id="category" required>
                <option value="">Select Category</option>
                <option>Food</option>
                <option>Travel</option>
                <option>Shopping</option>
                <option>Other</option>
            </select>

            <input id="date" type="date" required>

            <button type="submit">+ Add Expense</button>
        </form>
        <div id="valuelist"></div>
    </div>

    <div class="section">
        <h2>Monthly Budget</h2>

        <input id="budget" type="number" min="0" step="0.01" placeholder="Enter monthly budget">
        <button id="saveBudget">Save Budget</button>

        <p id="warning"></p>
    </div>

    <div class="section tools">
        <input id="search" type="text" placeholder="Search expense">

        <select id="filter">
            <option value="All">All Categories</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Other</option>
        </select>

        <select id="sort">
            <option value="new">Newest First</option>
            <option value="old">Oldest First</option>
        </select>

        <button id="reset">Reset Filters</button>

        <button id="clear" class="delete">Clear All</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
